<meta charset="UTF-8">

<title>花红药业 — 企业信息化顶层架构设计 | Cytoscape 可视化编辑</title>
<script>
// Sequential library loader
(function loadLibs() {
  var base = 'https://cdn.jsdelivr.net/npm/';
  var libs = [
    base + 'dagre@0.8.5/dist/dagre.min.js',
    base + 'cytoscape@3.28.1/dist/cytoscape.min.js',
    base + 'cytoscape-dagre@2.5.0/cytoscape-dagre.js'
  ];
  var idx = 0;
  var fallback = [
    'https://unpkg.com/dagre@0.8.5/dist/dagre.min.js',
    'https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js',
    'https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js'
  ];
  function load(i, useFallback) {
    if (i >= libs.length) { console.log('All libs loaded'); return; }
    var s = document.createElement('script');
    s.src = useFallback ? fallback[i] : libs[i];
    s.onload = function() { console.log('Loaded: ' + s.src.split('/').pop()); load(i + 1, false); };
    s.onerror = function() {
      if (!useFallback) { console.warn('Retrying from unpkg: ' + fallback[i]); load(i, true); }
      else { console.error('Failed to load lib ' + i); }
    };
    document.head.appendChild(s);
  }
  load(0, false);
})();
</script>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0;
    --accent: #38bdf8; --btn-bg: #2563eb; --btn-hover: #1d4ed8;
    --success: #16a34a; --warn: #d97706;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .header{
    background:linear-gradient(135deg,#1a237e 0%,#0d47a1 40%,#004d40 100%);
    padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--border);flex-shrink:0;
  }
  .header .title{font-size:1.25rem;font-weight:700;letter-spacing:.5px}
  .header .title span{color:var(--accent)}
  .header .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .header .actions button{
    padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
    font-size:.8rem;transition:.2s;font-family:inherit
  }
  .header .actions button:hover{background:rgba(255,255,255,.18)}
  .header .actions .btn-edit{background:var(--btn-bg);border-color:var(--btn-bg)}
  .header .actions .btn-edit:hover{background:var(--btn-hover)}
  .header .actions .btn-dl{background:var(--success);border-color:var(--success)}
  .header .actions .btn-reset{background:var(--warn);border-color:var(--warn)}
  .header .badge{
    background:rgba(255,255,255,.12);padding:5px 12px;
    border-radius:20px;font-size:.78rem;letter-spacing:1px
  }
  .main{display:flex;flex:1;overflow:hidden}
  .sidebar{
    width:250px;background:var(--panel);border-right:1px solid var(--border);
    padding:10px 0;overflow-y:auto;flex-shrink:0
  }
  .sidebar .sec-title{
    font-size:.68rem;text-transform:uppercase;letter-spacing:2px;
    padding:6px 18px 3px;color:#94a3b8;margin-top:6px
  }
  .sidebar .tab{
    display:block;width:100%;padding:9px 18px;background:transparent;
    border:none;color:#cbd5e1;text-align:left;font-size:.85rem;
    cursor:pointer;transition:.12s;border-left:3px solid transparent;font-family:inherit
  }
  .sidebar .tab:hover{background:#334155;color:#fff}
  .sidebar .tab.active{
    background:#1e3a5f;color:#fff;border-left-color:var(--accent);font-weight:600
  }
  .sidebar .tab .emoji{margin-right:5px}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  #cy{flex:1;background:#f8fafc}
  .zoom-controls{
    position:absolute;bottom:20px;right:20px;display:flex;
    flex-direction:column;gap:4px;z-index:10
  }
  .zoom-controls button{
    width:38px;height:38px;border-radius:8px;border:1px solid #cbd5e1;
    background:#fff;color:#334155;font-size:1.1rem;cursor:pointer;
    transition:.15s;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1)
  }
  .zoom-controls button:hover{background:#f1f5f9;border-color:#94a3b8}
  .zoom-controls .zoom-label{
    text-align:center;font-size:.72rem;color:#64748b;background:#fff;
    border-radius:6px;padding:4px 6px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1e293b;color:#e2e8f0;padding:10px 24px;
    border-radius:8px;font-size:.82rem;z-index:100;
    border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.4);
    opacity:0;transition:opacity .3s;pointer-events:none
  }
  .toast.show{opacity:1}
  .text-editor{
    position:fixed;z-index:50;min-width:150px;min-height:40px;
    background:#fff;border:2px solid #2563eb;border-radius:6px;
    padding:6px 10px;font-size:13px;outline:none;
    box-shadow:0 4px 20px rgba(0,0,0,.25);font-family:inherit
  }
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
  @media(max-width:900px){
    .main{flex-direction:column}
    .sidebar{width:100%;max-height:180px;display:flex;flex-wrap:wrap;overflow-x:auto;padding:6px}
    .sidebar .sec-title{display:none}
    .sidebar .tab{flex-shrink:0;border-left:none;border-bottom:3px solid transparent;font-size:.75rem;padding:7px 10px}
    .sidebar .tab.active{border-left:none;border-bottom-color:var(--accent)}
  }
  @media print{
    .sidebar,.header .actions,.zoom-controls{display:none!important}
    #cy{background:#fff!important}
  }
</style>
</head>

      <span class="emoji">🔧</span> 支撑保障体系

    <div class="sec-title">🔀 数据集成</div>

  </nav>

  <div class="content">
    <div id="cy"></div>
    <div class="zoom-controls" id="zoomControls">
      <button onclick="zoomCy(1.2)" title="放大">＋</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button onclick="zoomCy(0.8)" title="缩小">−</button>

      <button onclick="zoomCy('reset')" title="重置缩放">↺</button>

  </div>
</div>

<div class="toast" id="toast"></div>

/* ═════════════════════════════════════════════
   MERMAID TEXT PARSER
   ═════════════════════════════════════════════ */
function parseMermaidDiagram(mermaidText) {
  // Parse classDefs
  const classDefs = {};
  const cdRe = /classDef\s+(\w+)\s+(.+)/g;
  let cm;
  while ((cm = cdRe.exec(mermaidText)) !== null) {
    const s = {};
    if (cm[2].includes('fill:')) s.fill = cm[2].match(/fill:(#[^\s,]+)/)[1];
    if (cm[2].includes('stroke:')) s.stroke = cm[2].match(/stroke:(#[^\s,]+)/)[1];
    if (cm[2].includes('color:')) s.color = cm[2].match(/color:(#[^\s,]+)/)[1];
    if (cm[2].includes('stroke-width:')) s.sw = cm[2].match(/stroke-width:(\d+)/)[1];
    if (cm[2].includes('stroke-dasharray:')) s.dashed = true;
    classDefs[cm[1]] = s;
  }

  // Parse class assignments
  const classAssigns = {};
  const caRe = /^\s*class\s+([\w,]+)\s+(\w+)\s*$/gm;
  let am;
  while ((am = caRe.exec(mermaidText)) !== null) {
    am[1].split(',').map(s => s.trim()).filter(Boolean).forEach(id => {
      classAssigns[id] = am[2];
    });
  }

  // Parse nodes
  const nodes = [];
  const nodeMap = {};
  const nodeRe = /(\w+)\[("|')([\s\S]*?)("|')\]/g;
  let nm;
  while ((nm = nodeRe.exec(mermaidText)) !== null) {
    const id = nm[1], label = nm[3].replace(/<br\/?>/g, '\n');
    const cls = classAssigns[id] || '';
    const styleDef = classDefs[cls] || null;
    nodes.push({ data: { id, label, cls } });
    nodeMap[id] = { cls, styleDef };
  }

  // Parse edges
  const edges = [];
  const edgeSet = new Set();
  const lines = mermaidText.split('\n');
  for (let line of lines) {
    line = line.trim();
    if (!line || /^(classDef|class\s|subgraph|end|direction|flowchart)/.test(line)) continue;
    line = line.replace(/(\w+)\["[^"]*"\]/g, '$1');
    const edgeRe = /(\w+)\s*(--\s*"([^"]*)"\s*)?(-->|==>|-\.->|<-->|---)\s*(\|"([^"]*)"\|)?\s*(\w+)/g;
    let em;
    while ((em = edgeRe.exec(line)) !== null) {
      const src = em[1], label1 = em[3] || '', op = em[4], label2 = em[6] || '', tgt = em[7];
      if (op === '~~~') continue;
      const label = label1 || label2;
      let type = 'solid';
      if (op === '==>') type = 'thick';
      else if (op === '-.->') type = 'dashed';
      else if (op === '<-->') type = 'bidirectional';
      else if (op === '---') type = 'none';
      const key = src + '->' + tgt;
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        edges.push({ data: { id: 'e' + edges.length, source: src, target: tgt, label, type, bidirectional: op === '<-->' } });
      }
      const tgtStart = em[0].lastIndexOf(tgt);
      if (tgtStart > 0) edgeRe.lastIndex = em.index + tgtStart;
    }
  }

  // Parse subgraph hierarchy — stack-based line-by-line (handles nested subgraphs correctly)
  const subgraphs = {};
  const parentMap = {};
  const stack = [];

  const textLines = mermaidText.split('\n');
  for (let i = 0; i < textLines.length; i++) {
    const line = textLines[i].trim();

    // Check for subgraph definition: subgraph ID["label"] or subgraph ID['label']
    const sgMatch = line.match(/^\s*subgraph\s+(\w+)\s*\[("|')([\s\S]*?)("|')\]\s*$/);
    if (sgMatch) {
      const sgId = sgMatch[1], sgLabel = sgMatch[3].replace(/<br\/?>/g, '\n');
      subgraphs[sgId] = { id: sgId, label: sgLabel, children: [] };
      if (stack.length > 0) {
        const parentId = stack[stack.length - 1];
        parentMap[sgId] = parentId;
        subgraphs[parentId].children.push(sgId);
      }
      stack.push(sgId);
      continue;
    }

    // Check for end of subgraph
    if (/^\s*end\s*$/.test(line)) {
      if (stack.length > 0) stack.pop();
      continue;
    }

    // Skip directive / classDef / class assignment lines
    if (/^\s*(flowchart|direction|classDef|class\s)/.test(line)) continue;

    // Find node definitions on this line (ID["…"] or ID['…'])
    const nodeDefRe = /(\w+)\s*\[("|')/g;
    let ndMatch;
    while ((ndMatch = nodeDefRe.exec(line)) !== null) {
      const nid = ndMatch[1];
      if (stack.length > 0) {
        const currentParent = stack[stack.length - 1];
        parentMap[nid] = currentParent;
        if (!subgraphs[currentParent].children.includes(nid)) {
          subgraphs[currentParent].children.push(nid);
        }
      }
    }
  }

  // Add / override subgraph compound nodes (merge with nodeRe results to avoid duplicates)
  Object.values(subgraphs).forEach(sg => {
    const existingIdx = nodes.findIndex(n => n.data.id === sg.id);
    if (existingIdx >= 0) {
      nodes[existingIdx].classes = 'subgraph';
      nodes[existingIdx].data.cls = '__subgraph';
      nodes[existingIdx].data.label = sg.label;
    } else {
      nodes.push({ data: { id: sg.id, label: sg.label, cls: '__subgraph' }, classes: 'subgraph' });
    }
  });

  // Set parent for child nodes (both leaf nodes and nested subgraph compounds)
  nodes.forEach(n => {
    if (parentMap[n.data.id]) {
      n.data.parent = parentMap[n.data.id];
    }
  });

  // Mark leaf nodes inside MAIN with black-border class (d0 only)
  function isMainDescendant(nid) {
    let cur = parentMap[nid];
    while (cur) {
      if (cur === 'MAIN') return true;
      cur = parentMap[cur];
    }
    return false;
  }
  nodes.forEach(n => {
    if (isMainDescendant(n.data.id)) {
      n.classes = (n.classes ? n.classes + ' ' : '') + 'in-main';
    }
  });

  // Detect direction
  const isLR = mermaidText.trim().startsWith('flowchart LR');

  return { nodes, edges, classDefs, classAssigns, nodeMap, subgraphs, parentMap, isLR };
}

/* ═════════════════════════════════════════════
   STATE
   ═════════════════════════════════════════════ */
let cy = null;
let currentDiagram = 'd0';
let isEditMode = false;
let textEditEl = null;
let currentParsed = null;

function storageKey(id) { return 'cy6_' + id; }

function saveState() {
  if (!cy) return;
  const state = { positions: {}, labels: {} };
  cy.nodes().forEach(n => {
    state.positions[n.id()] = n.position();
    state.labels[n.id()] = n.data('label') || '';
  });
  try {
    localStorage.setItem(storageKey(currentDiagram), JSON.stringify(state));
    localStorage.setItem('cy6_lastDiagram', currentDiagram);
  } catch(e) {}
}

function loadState(id) {
  try {
    const data = localStorage.getItem(storageKey(id));
    return data ? JSON.parse(data) : null;
  } catch(e) { return null; }
}

/* ═════════════════════════════════════════════
   CYTOSCAPE INIT
   ═════════════════════════════════════════════ */
function initCy(container, elements, isLR) {
  if (cy) cy.destroy();

  cy = cytoscape({
    container: container,
    elements: elements,
    style: buildCyStyle(),
    layout: {
      name: 'dagre',
      rankDir: isLR ? 'LR' : 'TB',
      spacingFactor: 1.3,
      nodeSep: 40,
      edgeSep: 20,
      rankSep: 80,
      animate: false,
    },
    wheelSensitivity: 0.3,
    minZoom: 0.1,
    maxZoom: 4,
  });

  // Apply saved state (positions + labels)
  const saved = loadState(currentDiagram);
  if (saved) {
    cy.ready(() => {
      cy.nodes().forEach(n => {
        if (saved.positions && saved.positions[n.id()]) n.position(saved.positions[n.id()]);
        if (saved.labels && saved.labels[n.id()]) n.data('label', saved.labels[n.id()]);
      });
    });
  }

  // Events
  cy.on('dragfree', 'node', saveState);
  cy.on('dblclick', 'node', onNodeDblClick);
  cy.on('zoom', updateZoomLabel);
  cy.on('tap', (e) => {
    if (e.target === cy && textEditEl) finishTextEdit();
  });

  updateNodeGrab();
}

function updateNodeGrab() {
  if (!cy) return;
  cy.nodes().forEach(n => {
    if (n.hasClass('subgraph')) {
      n.grabbable(false);
    } else {
      n.grabbable(isEditMode);
    }
  });
  if (isEditMode) {
    cy.userPanningEnabled(true);
    cy.userZoomingEnabled(true);
  }
}

/* ═════════════════════════════════════════════
   TEXT EDITING
   ═════════════════════════════════════════════ */
function onNodeDblClick(evt) {
  if (!isEditMode) return;
  const node = evt.target;
  if (node.hasClass('subgraph')) return;

  if (textEditEl) finishTextEdit();

  const renderedPos = node.renderedPosition();
  const label = node.data('label') || '';

  textEditEl = document.createElement('div');
  textEditEl.className = 'text-editor';
  textEditEl.contentEditable = 'true';
  textEditEl.innerHTML = label.replace(/\n/g, '<br/>');
  textEditEl.setAttribute('data-node-id', node.id());
  textEditEl.style.left = renderedPos.x + 'px';
  textEditEl.style.top = renderedPos.y + 'px';
  document.getElementById('cy').parentElement.appendChild(textEditEl);

  textEditEl.addEventListener('blur', finishTextEdit);
  textEditEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { textEditEl.innerHTML = label.replace(/\n/g, '<br/>'); finishTextEdit(); }
    if (e.key === 'Enter' && e.ctrlKey) finishTextEdit();
  });
  textEditEl.focus();
}

function finishTextEdit() {
  if (!textEditEl) return;
  const nid = textEditEl.getAttribute('data-node-id');
  const newLabel = textEditEl.innerHTML.replace(/<br\/?>/g, '\n').replace(/&nbsp;/g, ' ');
  textEditEl.remove();
  textEditEl = null;
  if (nid && cy) {
    const node = cy.getElementById(nid);
    if (node.length && newLabel !== node.data('label')) {
      node.data('label', newLabel);
      saveState();
      toast('✅ 文字已更新');
    }
  }
}

/* ═════════════════════════════════════════════
   UI
   ═════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function renderDiagram(id) {
  const mermaidText = diagramSources[id];
  if (!mermaidText) return;
  currentParsed = parseMermaidDiagram(mermaidText);

  // Convert to Cytoscape elements
  const elements = [...currentParsed.nodes, ...currentParsed.edges];

  initCy(document.getElementById('cy'), elements, currentParsed.isLR);
  document.getElementById('statusBadge').textContent = 'v6.0 | ' + (isEditMode ? '编辑中 ✏️' : '预览中 👁️');
  updateZoomLabel();
}

async function switchDiagram(btn) {
  const newId = btn.dataset.diagram;
  if (newId === currentDiagram && btn.classList.contains('active')) return;

  if (textEditEl) finishTextEdit();
  saveState();

  document.querySelectorAll('.sidebar .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentDiagram = newId;

  await renderDiagram(newId);
}

function toggleEdit() {
  if (textEditEl) finishTextEdit();
  isEditMode = !isEditMode;
  const btn = document.getElementById('btnEdit');

  if (isEditMode) {
    btn.textContent = '👁️ 预览模式';
    btn.style.background = 'var(--success)';
    toast('✏️ 编辑模式：拖拽移动节点，双击编辑文字');
  } else {
    btn.textContent = '✏️ 编辑模式';
    btn.style.background = 'var(--btn-bg)';
    saveState();
    toast('👁️ 预览模式');
  }
  updateNodeGrab();
  document.getElementById('statusBadge').textContent = 'v6.0 | ' + (isEditMode ? '编辑中 ✏️' : '预览中 👁️');
}

function resetDiagram() {
  if (!confirm('确定恢复「' + currentDiagram + '」为默认布局？编辑的文字不会丢失。')) return;
  try { localStorage.removeItem(storageKey(currentDiagram)); } catch(e) {}
  renderDiagram(currentDiagram);
  toast('↺ 布局已重置');
}

function zoomCy(action) {
  if (!cy) return;
  if (action === 'fit') { cy.fit(null, 40); }
  else if (action === 'reset') { cy.zoom(1); cy.center(); }
  else { cy.zoom(cy.zoom() * action); }
  updateZoomLabel();
}

function updateZoomLabel() {
  if (!cy) return;
  document.getElementById('zoomLabel').textContent = Math.round(cy.zoom() * 100) + '%';
}

/* ═════════════════════════════════════════════
   EXPORT
   ═════════════════════════════════════════════ */
function downloadDrawio() {
  if (!cy || !currentParsed) return;
  saveState();

  const classDefs = currentParsed.classDefs;
  const nodeMap = currentParsed.nodeMap;

  function esc(raw) {
    return (raw||'').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function styleStr(def) {
    if (!def) return 'rounded=1;whiteSpace=wrap;html=1;';
    const p = ['rounded=1', 'whiteSpace=wrap', 'html=1'];
    if (def.fill) p.push('fillColor=' + def.fill);
    if (def.stroke) p.push('strokeColor=' + def.stroke);
    if (def.color) p.push('fontColor=' + def.color);
    if (def.sw) p.push('strokeWidth=' + def.sw);
    if (def.dashed) p.push('dashed=1');
    return p.join(';') + ';';
  }

  let xml = `<mxGraphModel dx="0" dy="0" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1600" pageHeight="1200">
  <root>
    <mxCell id="0"/>
    <mxCell id="1" parent="0"/>
`;
  let counter = 2;
  const idMap = {};

  cy.nodes().forEach(n => {
    const nid = n.id();
    const pos = n.position();
    const label = n.data('label') || '';
    const cid = 'cell-' + (counter++);
    idMap[nid] = cid;
    const info = nodeMap[nid] || {};
    xml += `    <mxCell id="${cid}" value="${esc(label)}" style="${styleStr(info.styleDef)}" vertex="1" parent="1">
      <mxGeometry x="${Math.round(pos.x)}" y="${Math.round(pos.y)}" width="180" height="80" as="geometry"/>
    </mxCell>
`;
  });

  cy.edges().forEach(e => {
    const src = idMap[e.data('source')], tgt = idMap[e.data('target')];
    if (!src || !tgt) return;
    const cid = 'cell-' + (counter++);
    let es = 'edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;';
    const type = e.data('type') || 'solid';
    if (type === 'dashed') es += 'dashed=1;dashPattern=8 8;';
    else if (type === 'thick') es += 'strokeWidth=3;';
    es += 'endArrow=classic;';
    if (type === 'bidirectional') es += 'startArrow=classic;';
    xml += `    <mxCell id="${cid}" value="${esc(e.data('label')||'')}" style="${es}" edge="1" parent="1" source="${src}" target="${tgt}">
      <mxGeometry relative="1" as="geometry"/>
    </mxCell>
`;
  });

  xml += `  </root>
</mxGraphModel>`;

  const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `花红药业架构图_${currentDiagram}.drawio`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ .drawio 已下载');
}

function downloadPNG() {
  if (!cy) return;
  const dataUrl = cy.png({ full: true, scale: 2, bg: '#ffffff' });
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `花红药业架构图_${currentDiagram}.png`;
  a.click();
  toast('✅ PNG 已下载');
}

function printDiagram() { window.print(); }

/* ═════════════════════════════════════════════
   KEYBOARD
   ═════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'e') { e.preventDefault(); toggleEdit(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); downloadDrawio(); }
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); zoomCy('fit'); }
  if (e.key === 'Escape' && isEditMode) { e.preventDefault(); toggleEdit(); }
});

/* ═════════════════════════════════════════════
   BOOT
   ═════════════════════════════════════════════ */
async function boot() {
  try {
    document.getElementById('statusBadge').textContent = 'v6.0 | 等待库加载...';

    // Wait for all 3 libraries (with timeout)
    if (typeof cytoscape === 'undefined' || typeof dagre === 'undefined' || typeof cytoscapeDagre === 'undefined') {
      await new Promise((resolve, reject) => {
        let waited = 0;
        const check = () => {
          if (typeof cytoscape !== 'undefined' && typeof dagre !== 'undefined' && typeof cytoscapeDagre !== 'undefined') {
            cytoscape.use(cytoscapeDagre);
            return resolve();
          }
          if (waited > 25000) return reject(new Error('库加载超时（dagre/cytoscape/cytoscape-dagre）'));
          waited += 100;
          setTimeout(check, 100);
        };
        check();
      });
    } else {
      cytoscape.use(cytoscapeDagre);
    }

    const hash = window.location.hash.replace('#', '');
    const startId = (hash && diagramSources[hash]) ? hash : 'd0';
    currentDiagram = startId;

    const activeBtn = document.querySelector(`[data-diagram="${startId}"]`);
    if (activeBtn) {
      document.querySelectorAll('.sidebar .tab').forEach(t => t.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    await renderDiagram(startId);
    document.getElementById('statusBadge').textContent = 'v6.0 | 就绪 👁️';

  } catch(e) {
    console.error('Boot failed:', e);
    document.getElementById('cy').innerHTML =
      '<div style="text-align:center;color:#f87171;padding:60px;"><div style="font-size:2rem;">⚠️</div><div>初始化失败：' + e.message + '</div><div style="color:#94a3b8;margin-top:8px;">请检查网络连接后刷新（F5）</div></div>';
    document.getElementById('statusBadge').textContent = 'v6.0 | 错误';
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
