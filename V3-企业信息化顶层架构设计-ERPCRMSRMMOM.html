<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> — 企业信息化顶层架构设计 | ERP+CRM+SRM+MOM</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js">
</script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --accent: #38bdf8;
    --btn-bg: #2563eb;
    --btn-hover: #1d4ed8;
    --success: #16a34a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;user-select:none;
  }
  .header{
    background:linear-gradient(135deg,#1a237e 0%,#0d47a1 40%,#004d40 100%);
    padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--border);flex-shrink:0;
  }
  .header .title{font-size:1.25rem;font-weight:700;letter-spacing:.5px}
  .header .title span{color:var(--accent)}
  .header .badge{
    background:rgba(255,255,255,.12);padding:5px 12px;
    border-radius:20px;font-size:.78rem;letter-spacing:1px
  }
  .header .actions{display:flex;gap:8px;flex-wrap:wrap}
  .header .actions button{
    padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
    font-size:.8rem;transition:.2s;font-family:inherit
  }
  .header .actions button:hover{background:rgba(255,255,255,.18)}
  .header .actions .btn-edit{background:var(--btn-bg);border-color:var(--btn-bg)}
  .header .actions .btn-edit:hover{background:var(--btn-hover)}
  .header .actions .btn-dl{background:var(--success);border-color:var(--success)}
  .main{display:flex;flex:1;overflow:hidden}
  .sidebar{
    width:250px;background:var(--panel);border-right:1px solid var(--border);
    padding:10px 0;overflow-y:auto;flex-shrink:0
  }
  .sidebar .sec-title{
    font-size:.68rem;text-transform:uppercase;letter-spacing:2px;
    padding:6px 18px 3px;color:#94a3b8;margin-top:6px
  }
  .sidebar .tab{
    display:block;width:100%;padding:9px 18px;background:transparent;
    border:none;color:#cbd5e1;text-align:left;font-size:.85rem;
    cursor:pointer;transition:.12s;border-left:3px solid transparent;font-family:inherit
  }
  .sidebar .tab:hover{background:#334155;color:#fff}
  .sidebar .tab.active{
    background:#1e3a5f;color:#fff;border-left-color:var(--accent);font-weight:600
  }
  .sidebar .tab .emoji{margin-right:5px}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .diagram-panel{
    flex:1;position:relative;overflow:hidden;background:#f1f5f9;cursor:grab
  }
  .diagram-panel.dark-bg{background:#0f172a}
  .diagram-panel.grabbing{cursor:grabbing}
  .diagram-panel .mermaid-wrap{
    position:absolute;top:50%;left:50%;transform-origin:0 0;will-change:transform
  }
  .diagram-panel .mermaid{
    background:#fff;border-radius:12px;padding:24px 18px;
    box-shadow:0 4px 24px rgba(0,0,0,.08);display:inline-block;min-width:max-content
  }
  .diagram-panel.dark-bg .mermaid{
    background:#1e293b;box-shadow:0 4px 24px rgba(0,0,0,.3)
  }
  .diagram-panel .mermaid svg{display:block;max-width:none!important;width:auto!important;height:auto!important}
  .zoom-controls{
    position:absolute;bottom:20px;right:20px;display:flex;
    flex-direction:column;gap:4px;z-index:10
  }
  .zoom-controls button{
    width:38px;height:38px;border-radius:8px;border:1px solid #cbd5e1;
    background:#fff;color:#334155;font-size:1.1rem;cursor:pointer;
    transition:.15s;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1)
  }
  .zoom-controls button:hover{background:#f1f5f9;border-color:#94a3b8}
  .zoom-controls .zoom-label{
    text-align:center;font-size:.72rem;color:#64748b;background:#fff;
    border-radius:6px;padding:4px 6px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)
  }
  .zoom-controls .btn-fit{font-size:.7rem;width:38px}
  .edit-panel{
    display:none;flex-direction:column;border-top:2px solid var(--border);
    background:#0c1222;flex-shrink:0
  }
  .edit-panel.show{display:flex}
  .edit-panel .toolbar{
    display:flex;gap:8px;padding:6px 14px;background:#1a1f2e;
    border-bottom:1px solid var(--border);flex-wrap:wrap
  }
  .edit-panel .toolbar button{
    padding:5px 12px;border-radius:6px;border:1px solid var(--border);
    background:#1e293b;color:#cbd5e1;cursor:pointer;font-size:.78rem;font-family:inherit
  }
  .edit-panel .toolbar button:hover{background:#334155;color:#fff}
  .edit-panel .toolbar button.run{background:var(--success);border-color:var(--success);color:#fff}
  .edit-panel textarea{
    flex:1;min-height:160px;background:#0c1222;color:#e2e8f0;
    font-family:'Cascadia Code','Fira Code','Consolas',monospace;
    font-size:.8rem;padding:14px;border:none;resize:vertical;outline:none;
    line-height:1.5;tab-size:2
  }
  .edit-panel .status{
    padding:5px 14px;font-size:.73rem;color:#94a3b8;background:#0f172a
  }
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
  @media(max-width:900px){
    .main{flex-direction:column}
    .sidebar{width:100%;max-height:180px;display:flex;flex-wrap:wrap;overflow-x:auto;padding:6px}
    .sidebar .sec-title{display:none}
    .sidebar .tab{flex-shrink:0;border-left:none;border-bottom:3px solid transparent;font-size:.75rem;padding:7px 10px}
    .sidebar .tab.active{border-left:none;border-bottom-color:var(--accent)}
    .diagram-panel .mermaid{padding:10px 6px}
    .zoom-controls{bottom:10px;right:10px}
    .zoom-controls button{width:32px;height:32px;font-size:.9rem}
  }
  @media print{
    .sidebar,.edit-panel,.header .actions,.zoom-controls{display:none!important}
    .diagram-panel{overflow:visible!important;background:#fff!important}
    .diagram-panel .mermaid-wrap{position:static!important;transform:none!important}
    .diagram-panel .mermaid{box-shadow:none;break-inside:avoid}
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title"> — <span>企业信息化顶层架构设计</span></div>
    <div style="font-size:.73rem;color:#94a3b8;margin-top:3px">ERP核心枢纽 · CRM客户关系 · SRM供应商关系 · MOM制造运营 | GMP合规</div>
  </div>
  <div class="actions">
    <button class="btn-edit" onclick="toggleEdit()">✏️ 编辑源码</button>
    <button class="btn-dl" onclick="downloadSVG()">📥 下载SVG</button>
    <button onclick="downloadMermaid()">📄 导出源码</button>
    <button onclick="printDiagram()">🖨️ 打印</button>
    <span class="badge">v2.2 | 2026-05</span>
  </div>
</div>

<div class="main">

  <nav class="sidebar">
    <div class="sec-title">📐 总体架构</div>
    <button class="tab active" data-diagram="d0" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">🏗️</span> 总体架构全景图
    </button>
    <div class="sec-title">🔗 核心主链路</div>
    <button class="tab" data-diagram="d1" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">📋</span> 计划与采购管理
    </button>
    <button class="tab" data-diagram="d2" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">📦</span> 仓储与物料管理
    </button>
    <button class="tab" data-diagram="d3" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">🏭</span> 生产制造全流程
    </button>
    <button class="tab" data-diagram="d4" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">🔬</span> 质量检验与放行
    </button>
    <button class="tab" data-diagram="d5" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">🚚</span> 销售物流与追溯
    </button>
    <div class="sec-title">🛡️ 支撑保障</div>
    <button class="tab" data-diagram="d6" data-dark="false" onclick="switchDiagram(this)">
      <span class="emoji">🔧</span> 支撑保障体系
    </button>
    <div class="sec-title">🔀 数据集成</div>
    <button class="tab" data-diagram="d7" data-dark="true" onclick="switchDiagram(this)">
      <span class="emoji">🌐</span> 系统数据流与集成
    </button>
  </nav>

  <div class="content">
    <div class="diagram-panel" id="diagramPanel">
      <div class="mermaid-wrap" id="mermaidWrap">
        <div class="mermaid" id="mermaidContainer"></div>
      </div>
      <div class="zoom-controls" id="zoomControls">
        <button onclick="panZoom.zoomIn()" title="放大">＋</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button onclick="panZoom.zoomOut()" title="缩小">－</button>
        <button class="btn-fit" onclick="panZoom.fitToScreen()" title="适应窗口">⊡</button>
        <button onclick="panZoom.reset()" title="重置">↺</button>
      </div>
    </div>

    <div class="edit-panel" id="editPanel">
      <div class="toolbar">
        <button class="run" onclick="applyEdit()">▶ 应用更改</button>
        <button onclick="resetCurrentDiagram()">↺ 恢复默认</button>
        <button onclick="formatMermaid()">📐 格式化</button>
        <span style="flex:1"></span>
        <span style="font-size:.73rem;color:#94a3b8">Ctrl+E编辑 · Ctrl+S应用 · Esc退出</span>
      </div>
      <textarea id="editTextarea" spellcheck="false"></textarea>
      <div class="status" id="editStatus">编辑模式 · 修改后点击「应用更改」更新图表</div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   MERMAID INIT
   ═══════════════════════════════════════════════════ */
mermaid.initialize({
  startOnLoad:false,
  theme:'base',
  securityLevel:'loose',
  flowchart:{
    useMaxWidth:false,
    htmlLabels:true,
    curve:'basis',
    padding:18,
    nodeSpacing:45,
    rankSpacing:55,
  },
  themeVariables:{
    primaryColor:'#e8f0fe',
    primaryBorderColor:'#1a237e',
    primaryTextColor:'#1e293b',
    lineColor:'#475569',
    secondaryColor:'#fce4ec',
    tertiaryColor:'#e0f2f1',
  }
});

/* ═══════════════════════════════════════════════════
   DIAGRAM SOURCES
   ═══════════════════════════════════════════════════ */
const diagramSources = {

  /* ───── d0: 总体架构全景图 — ERP中心·三角环绕·图例右上 ───── */
  d0: `flowchart LR

    subgraph MAIN[" — 企业信息化顶层架构"]
        direction TB

        subgraph SRM["🔗 SRM 供应商关系管理 — 计划与采购管理链路"]
            direction LR
            SRM1["① 需求计划制定<br/>销售预测·库存·产能<br/>→ MPS/MRP/采购申请"]
            SRM2["② 供应商准入审计<br/>资质·GMP证书·产地<br/>→ 合格名录·分级"]
            SRM3["③ 采购下单协同<br/>MRP·价格库·合同<br/>→ 采购订单PO"]
            SRM4["④ 到货接收初验<br/>PO·送货单·COA<br/>→ 到货单·初验记录"]
            SRM1 --> SRM2 --> SRM3 --> SRM4
        end

        ERP["🏭 ERP 企业资源计划系统<br/>━━━━━━━━━━━━━━━━━━━━<br/>📊 财务总账 · 💰 成本核算 · 🧾 应收应付<br/>📋 主数据管理MDM · 🗓️ 生产计划排产MPS/MRP<br/>📦 库存管理 · 👥 人力资源管理<br/>📈 商业智能BI · 📑 文档管理DMS<br/>━━━━━━━━━━━━━━━━━━━━<br/>⬤ 企业资源计划核心枢纽 ⬤"]

        subgraph CRM["🤝 CRM 客户关系管理 — 销售物流追溯链路"]
            direction LR
            CRM1["① 销售订单发货计划<br/>经销商订单·成品放行<br/>→ 发货单·出库指令"]
            CRM2["② 成品出库复核<br/>发货单·三期扫码<br/>→ 出库单·批次关联"]
            CRM3["③ 冷链常温运输<br/>温控标准·GPS<br/>→ 运输记录·签收单"]
            CRM4["④ 追溯与召回管理<br/>全链路批次·不良反馈<br/>→ 召回预案·监管上报"]
            CRM1 --> CRM2 --> CRM3 --> CRM4
        end

        subgraph MOM["⚙️ MOM 制造运营管理 — 生产·仓储·质量·保障"]
            direction TB
            subgraph MOM_WMS["📦 WMS 仓储管理"]
                direction LR
                W1["入库验收IQC"] --> W2["智能养护"] --> W3["出库备料"] --> W4["成品入库"]
            end
            subgraph MOM_MES["🏭 MES 制造执行"]
                direction LR
                MM1["工单排产"] --> MM2["前处理炮制"] --> MM3["提取浓缩"] --> MM4["制剂成型"] --> MM5["内包外包"]
            end
            subgraph MOM_QL["🔬 QMS+LIMS 质量管理"]
                direction LR
                QL1["取样管理"] --> QL2["检验检测"] --> QL3["偏差CAPA"] --> QL4["成品放行QA"]
            end
            subgraph MOM_SP["🔧 支撑保障"]
                direction LR
                SP1["EAM设备"] ; SP2["EMS环境"] ; SP3["HR人员"] ; SP4["验证合规"]
            end
        end

        GMP["🏛️ GMP合规监管<br/>药监数据上报·审计追踪<br/>数据完整性ALCOA+"]
        SCADA["📡 SCADA数据采集<br/>设备参数·环境实时数据"]
        TMS["🚚 TMS运输管理<br/>GPS·温控·签收"]

        SRM ==>|"MRP·采购申请·PO"| ERP
        ERP ==>|"生产计划·工单·物料需求"| MOM
        ERP ==>|"成品库存·销售订单·客户"| CRM

        SRM -.->|"到货初验→入库触发"| MOM
        MOM -.->|"放行单→可售库存→发货"| CRM
        CRM -.->|"发货指令→出库确认"| MOM

        MOM -.-> SCADA
        CRM -.-> TMS
        TMS -.-> CRM
        SCADA -.-> GMP
        MOM -.-> GMP
        CRM -.-> GMP
        SRM -.-> GMP
    end

    subgraph LEGEND["📋 图例"]
        direction TB
        L_ERP[" ERP 核心枢纽 "]
        L_SRM[" SRM 供应商关系管理 "]
        L_CRM[" CRM 客户关系管理 "]
        L_MOM[" MOM 制造运营管理 "]
        L_SUPP[" 支撑保障体系 "]
        L_EXT[" 外部系统 "]
    end

    MAIN ~~~ LEGEND

    classDef erpCore fill:#1a237e,stroke:#ffd600,color:#fff,stroke-width:3px
    classDef srmBlock fill:#c62828,stroke:#ffab91,color:#fff
    classDef crmBlock fill:#00695c,stroke:#80cbc4,color:#fff
    classDef momBlock fill:#e65100,stroke:#ffcc80,color:#fff
    classDef wmsNode fill:#bf360c,stroke:#ffab91,color:#fff
    classDef mesNode fill:#f57f17,stroke:#ffe082,color:#1e293b
    classDef qmsNode fill:#2e7d32,stroke:#a5d6a7,color:#fff
    classDef suppNode fill:#6a1b9a,stroke:#ce93d8,color:#fff
    classDef extNode fill:#37474f,stroke:#90a4ae,color:#fff,stroke-dasharray:5

    class ERP erpCore
    class SRM1,SRM2,SRM3,SRM4 srmBlock
    class CRM1,CRM2,CRM3,CRM4 crmBlock
    class W1,W2,W3,W4 wmsNode
    class MM1,MM2,MM3,MM4,MM5 mesNode
    class QL1,QL2,QL3,QL4 qmsNode
    class SP1,SP2,SP3,SP4 suppNode
    class GMP,SCADA,TMS extNode

    class L_ERP erpCore
    class L_SRM srmBlock
    class L_CRM crmBlock
    class L_MOM momBlock
    class L_SUPP suppNode
    class L_EXT extNode
`,

  /* ───── d1: 计划与采购管理 (SRM+ERP) ───── */
  d1: `flowchart TB
    classDef srm fill:#c62828,stroke:#ffab91,color:#fff
    classDef erp fill:#1a237e,stroke:#ffd600,color:#fff
    classDef wms fill:#bf360c,stroke:#ffab91,color:#fff

    subgraph PLANNING["📊 ERP — 需求计划与排产"]
        N1["节点1: 销售需求&生产计划制定<br/>━━━━━━━━━━━━━━━━━━<br/>📥 必要输入条件:<br/>①历史销售数据/市场订单/经销商要货计划<br/>②成品库存/在制工单/安全库存标准<br/>③产能/设备负荷/交期/GMP生产周期<br/>━━━━━━━━━━━━━━━━━━<br/>📤 输出: 年度/月度/周主计划·MRP·采购申请<br/>🤖 智能化: 智能排产·库存预警·需求预测算法·MRP自动运算<br/>✅ 合规: 计划符合GMP周期·变更留痕·BOM一致"]
    end

    subgraph SRM_BLOCK["🔗 SRM — 供应商全生命周期管理"]
        N2["节点2: 供应商准入&审计<br/>━━━━━━━━━━━━━━━━━━<br/>📥 必要输入条件:<br/>①营业执照/生产许可证/GMP证书/检验报告<br/>②原辅料标准/产地标准/质量风险评估<br/>━━━━━━━━━━━━━━━━━━<br/>📤 输出: 合格供应商名录·准入审批单·供应商分级<br/>🤖 智能化: 资质自动校验·审计流程线上化·分级自动评分·到期预警<br/>✅ 合规: 供应商资质合规·审计记录完整·道地药材产地可追溯"]

        N3["节点3: 原辅料/包材采购下单<br/>━━━━━━━━━━━━━━━━━━<br/>📥 必要输入条件:<br/>①MRP物料需求计划/采购申请审批完成<br/>②合格供应商/采购价格/合同条款<br/>━━━━━━━━━━━━━━━━━━<br/>📤 输出: 采购订单PO·到货计划<br/>🤖 智能化: 订单自动生成·价格自动校验·交期预警·合同线上审批<br/>✅ 合规: 采购订单与审批一致·合同合规·来源合格供应商"]

        N4["节点4: 到货接收与初验<br/>━━━━━━━━━━━━━━━━━━<br/>📥 必要输入条件:<br/>①采购订单/送货单/供应商出厂检验报告<br/>━━━━━━━━━━━━━━━━━━<br/>📤 输出: 到货单·初验记录·不合格拒收<br/>🤖 智能化: 到货单与PO自动匹配·标签扫码校验·不合格自动隔离<br/>✅ 合规: 到货记录完整·初验合规·不合格品处理留痕"]
    end

    subgraph NEXT["➡️ 下一环节"]
        WMS_TRIG["📦 触发 WMS 入库验收IQC"]
    end

    N1 --> N2 --> N3 --> N4 --> WMS_TRIG

    class N1 erp
    class N2,N3,N4 srm
    class WMS_TRIG wms

    N1 -.->|"MRP数据"| N3
    N2 -.->|"合格供应商名录"| N3
`,

  /* ───── d2: 仓储与物料管理 (WMS) ───── */
  d2: `flowchart TB
    classDef wms fill:#bf360c,stroke:#ffab91,color:#fff
    classDef ext fill:#37474f,stroke:#90a4ae,color:#fff

    subgraph WMS_FLOW["📦 WMS — 仓储与物料管理端到端流程"]
        direction TB

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */
let currentDiagram = 'd0';
let isEditMode = false;
const defaultSources = JSON.parse(JSON.stringify(diagramSources));

/* ═══════════════════════════════════════════════════
   PAN / ZOOM MANAGER
   ═══════════════════════════════════════════════════ */
const panZoom = {
  viewport: document.getElementById('diagramPanel'),
  wrap: document.getElementById('mermaidWrap'),
  scale: 1,
  tx: 0,
  ty: 0,
  dragging: false,
  dragStartX: 0,
  dragStartY: 0,
  dragStartTx: 0,
  dragStartTy: 0,
  pinchStartDist: 0,
  pinchStartScale: 1,
  pinchStartTx: 0,
  pinchStartTy: 0,
  pinchMidX: 0,
  pinchMidY: 0,

  init(){
    const vp=this.viewport;
    vp.addEventListener('mousedown',this.onMouseDown.bind(this));
    vp.addEventListener('wheel',this.onWheel.bind(this),{passive:false});
    document.addEventListener('mousemove',this.onMouseMove.bind(this));
    document.addEventListener('mouseup',this.onMouseUp.bind(this));
    vp.addEventListener('touchstart',this.onTouchStart.bind(this),{passive:false});
    document.addEventListener('touchmove',this.onTouchMove.bind(this),{passive:false});
    document.addEventListener('touchend',this.onTouchEnd.bind(this));
    vp.addEventListener('dblclick',this.onDblClick.bind(this));
    vp.addEventListener('contextmenu',e=>{if(this.dragging)e.preventDefault()});
  },

  applyTransform(){
    this.wrap.style.transform=`translate(${this.tx}px,${this.ty}px) scale(${this.scale})`;
    this.updateLabel();
  },

  updateLabel(){
    const lbl=document.getElementById('zoomLabel');
    if(lbl) lbl.textContent=Math.round(this.scale*100)+'%';
  },

  reset(){
    this.scale=1; this.tx=0; this.ty=0; this.applyTransform();
  },

  fitToScreen(){
    const vp=this.viewport;
    const wrap=this.wrap;
    const vpW=vp.clientWidth;
    const vpH=vp.clientHeight;
    const contentW=wrap.scrollWidth;
    const contentH=wrap.scrollHeight;
    if(contentW===0||contentH===0) return;
    const scaleX=(vpW-60)/contentW;
    const scaleY=(vpH-60)/contentH;
    const s=Math.min(scaleX,scaleY,1.5);
    this.scale=Math.max(0.15,s);
    this.tx=(vpW-contentW*this.scale)/2;
    this.ty=(vpH-contentH*this.scale)/2;
    this.applyTransform();
  },

  zoomAt(px,py,delta){
    const oldS=this.scale;
    let newS=oldS*(1+delta*0.0015);
    newS=Math.max(0.1,Math.min(6,newS));
    if(newS===oldS) return;
    this.tx=px-(px-this.tx)*(newS/oldS);
    this.ty=py-(py-this.ty)*(newS/oldS);
    this.scale=newS;
    this.applyTransform();
  },

  zoomIn(){
    const vp=this.viewport;
    this.zoomAt(vp.clientWidth/2,vp.clientHeight/2,-300);
  },

  zoomOut(){
    const vp=this.viewport;
    this.zoomAt(vp.clientWidth/2,vp.clientHeight/2,300);
  },

  onMouseDown(e){
    if(e.target.closest('.zoom-controls')||e.target.closest('button')) return;
    if(e.button!==0) return;
    e.preventDefault();
    this.dragging=true;
    this.dragStartX=e.pageX; this.dragStartY=e.pageY;
    this.dragStartTx=this.tx; this.dragStartTy=this.ty;
    this.viewport.classList.add('grabbing');
  },

  onMouseMove(e){
    if(!this.dragging) return;
    const dx=e.pageX-this.dragStartX;
    const dy=e.pageY-this.dragStartY;
    this.tx=this.dragStartTx+dx;
    this.ty=this.dragStartTy+dy;
    this.applyTransform();
  },

  onMouseUp(e){
    if(!this.dragging) return;
    this.dragging=false;
    this.viewport.classList.remove('grabbing');
  },

  onWheel(e){
    if(e.ctrlKey||e.metaKey) return;
    e.preventDefault();
    const rect=this.viewport.getBoundingClientRect();
    this.zoomAt(e.clientX-rect.left,e.clientY-rect.top,e.deltaY);
  },

  onTouchStart(e){
    if(e.touches.length===1){
      this.dragging=true;
      this.dragStartX=e.touches[0].pageX; this.dragStartY=e.touches[0].pageY;
      this.dragStartTx=this.tx; this.dragStartTy=this.ty;
    }else if(e.touches.length===2){
      this.dragging=false;
      const t0=e.touches[0],t1=e.touches[1];
      this.pinchStartDist=Math.hypot(t1.pageX-t0.pageX,t1.pageY-t0.pageY);
      this.pinchStartScale=this.scale;
      this.pinchStartTx=this.tx; this.pinchStartTy=this.ty;
      this.pinchMidX=(t0.pageX+t1.pageX)/2;
      this.pinchMidY=(t0.pageY+t1.pageY)/2;
    }
  },

  onTouchMove(e){
    if(e.touches.length===1&&this.dragging){
      e.preventDefault();
      const dx=e.touches[0].pageX-this.dragStartX;
      const dy=e.touches[0].pageY-this.dragStartY;
      this.tx=this.dragStartTx+dx;
      this.ty=this.dragStartTy+dy;
      this.applyTransform();
    }else if(e.touches.length===2&&this.pinchStartDist>0){
      e.preventDefault();
      const t0=e.touches[0],t1=e.touches[1];
      const dist=Math.hypot(t1.pageX-t0.pageX,t1.pageY-t0.pageY);
      const newScale=Math.max(0.1,Math.min(6,this.pinchStartScale*(dist/this.pinchStartDist)));
      const ratio=newScale/this.scale;
      const rect=this.viewport.getBoundingClientRect();
      const midX=(t0.pageX+t1.pageX)/2-rect.left;
      const midY=(t0.pageY+t1.pageY)/2-rect.top;
      this.tx=midX-(midX-this.tx)*ratio;
      this.ty=midY-(midY-this.ty)*ratio;
      this.scale=newScale;
      this.applyTransform();
    }
  },

  onTouchEnd(e){
    if(e.touches.length===0){
      this.dragging=false;
      this.pinchStartDist=0;
      this.viewport.classList.remove('grabbing');
    }
  },

  onDblClick(e){
    if(e.target.closest('.zoom-controls')||e.target.closest('button')) return;
    this.fitToScreen();
  }
};

panZoom.init();

/* ═══════════════════════════════════════════════════
   RENDER DIAGRAM
   ═══════════════════════════════════════════════════ */
async function renderDiagram(id){
  const container=document.getElementById('mermaidContainer');
  const source=diagramSources[id]||'';
  container.innerHTML='';
  container.removeAttribute('data-processed');
  try{
    const {svg}=await mermaid.render('mermaidSvg',source);
    container.innerHTML=svg;
    const svgEl=container.querySelector('svg');
    if(svgEl){
      svgEl.style.maxWidth='none';
      svgEl.style.width='auto';
      svgEl.style.height='auto';
    }
    document.getElementById('editStatus').textContent='✅ 图表渲染成功';
    document.getElementById('editStatus').style.color='#4ade80';
    panZoom.reset();
    setTimeout(()=>panZoom.fitToScreen(),180);
  }catch(err){
    container.innerHTML=`<div style="color:#dc2626;padding:24px;font-family:monospace;font-size:.85rem;white-space:pre-wrap;">
<b>❌ 渲染错误:</b>
${err.message||err}</div>`;
    document.getElementById('editStatus').textContent='❌ 渲染失败: '+(err.message||err);
    document.getElementById('editStatus').style.color='#f87171';
  }
}

/* ═══════════════════════════════════════════════════
   SWITCH DIAGRAM
   ═══════════════════════════════════════════════════ */
async function switchDiagram(btn){
  document.querySelectorAll('.sidebar .tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const id=btn.dataset.diagram;
  const dark=btn.dataset.dark==='true';
  currentDiagram=id;
  const panel=document.getElementById('diagramPanel');
  if(dark) panel.classList.add('dark-bg');
  else panel.classList.remove('dark-bg');
  if(isEditMode){
    document.getElementById('editTextarea').value=diagramSources[id]||'';
  }
  await renderDiagram(id);
}

/* ═══════════════════════════════════════════════════
   EDIT MODE
   ═══════════════════════════════════════════════════ */
function toggleEdit(){
  const panel=document.getElementById('editPanel');
  isEditMode=!isEditMode;
  if(isEditMode){
    panel.classList.add('show');
    document.getElementById('editTextarea').value=diagramSources[currentDiagram]||'';
    document.querySelector('.btn-edit').textContent='👁️ 预览模式';
    document.getElementById('editStatus').textContent='编辑模式 · 修改后点击「应用更改」更新图表';
    document.getElementById('editStatus').style.color='#94a3b8';
  }else{
    panel.classList.remove('show');
    document.querySelector('.btn-edit').textContent='✏️ 编辑源码';
    renderDiagram(currentDiagram);
  }
}

function applyEdit(){
  const newSource=document.getElementById('editTextarea').value;
  diagramSources[currentDiagram]=newSource;
  renderDiagram(currentDiagram);
  document.getElementById('editStatus').textContent='✅ 更改已应用';
  document.getElementById('editStatus').style.color='#4ade80';
  setTimeout(()=>{
    document.getElementById('editStatus').textContent='编辑模式 · 修改后点击「应用更改」更新图表';
    document.getElementById('editStatus').style.color='#94a3b8';
  },2000);
}

function resetCurrentDiagram(){
  if(confirm('确定恢复当前图表为默认版本？修改将丢失。')){
    diagramSources[currentDiagram]=defaultSources[currentDiagram];
    document.getElementById('editTextarea').value=defaultSources[currentDiagram];
    renderDiagram(currentDiagram);
  }
}

function formatMermaid(){
  const ta=document.getElementById('editTextarea');
  ta.value=ta.value.replace(/\t/g,'  ');
  document.getElementById('editStatus').textContent='📐 已格式化（基础）';
  document.getElementById('editStatus').style.color='#94a3b8';
}

/* ═══════════════════════════════════════════════════
   DOWNLOAD / PRINT
   ═══════════════════════════════════════════════════ */
function downloadSVG(){
  const svg=document.getElementById('mermaidContainer').querySelector('svg');
  if(!svg){alert('请等待图表渲染完成');return}
  const clone=svg.cloneNode(true);
  const serializer=new XMLSerializer();
  const data=serializer.serializeToString(clone);
  const blob=new Blob([data],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`架构图_${currentDiagram}.svg`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadMermaid(){
  const source=diagramSources[currentDiagram]||'';
  const blob=new Blob([source],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`架构图_${currentDiagram}.mmd`;
  a.click();
  URL.revokeObjectURL(url);
}

function printDiagram(){window.print()}

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
   ═══════════════════════════════════════════════════ */
document.addEventListener('keydown',(e)=>{
  if(e.ctrlKey&&e.key==='e'){e.preventDefault();toggleEdit()}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();isEditMode?applyEdit():downloadMermaid()}
  if(e.ctrlKey&&e.key==='0'){e.preventDefault();panZoom.fitToScreen()}
  if(e.key==='Escape'&&isEditMode){e.preventDefault();toggleEdit()}
});

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',async()=>{
  await renderDiagram('d0');
  const hash=window.location.hash.replace('#','');
  if(hash&&diagramSources[hash]){
    const btn=document.querySelector(`[data-diagram="${hash}"]`);
    if(btn) switchDiagram(btn);
  }
});

let resizeTimeout;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimeout);
  resizeTimeout=setTimeout(()=>{},300);
});
</script>
