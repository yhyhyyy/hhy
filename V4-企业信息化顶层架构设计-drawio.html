<script>
// Dynamic Mermaid loader with CDN fallback
(function loadMermaid() {
  var CDNS = [
    'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
    'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js'
  ];
  var idx = 0;
  function tryNext() {
    if (idx >= CDNS.length) {
      document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('svgContainer');
        if (el) el.innerHTML = '<div style="text-align:center;color:#f87171;padding:40px;"><div style="font-size:2rem;margin-bottom:12px;">⚠️</div><div style="font-size:.9rem;">Mermaid.js 加载失败</div><div style="color:#94a3b8;font-size:.78rem;margin-top:8px;">所有 CDN 均不可用，请检查网络连接</div></div>';
        var b = document.getElementById('statusBadge');
        if (b) b.textContent = 'v5.0 | CDN 不可用';
      });
      return;
    }
    var s = document.createElement('script');
    s.src = CDNS[idx];
    s.onload = function() { console.log('Mermaid loaded from: ' + CDNS[idx]); };
    s.onerror = function() { idx++; tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0;
    --accent: #38bdf8; --btn-bg: #2563eb; --btn-hover: #1d4ed8;
    --success: #16a34a; --warn: #d97706;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .header{
    background:linear-gradient(135deg,#1a237e 0%,#0d47a1 40%,#004d40 100%);
    padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--border);flex-shrink:0;
  }
  .header .title{font-size:1.25rem;font-weight:700;letter-spacing:.5px}
  .header .title span{color:var(--accent)}
  .header .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .header .actions button{
    padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
    font-size:.8rem;transition:.2s;font-family:inherit
  }
  .header .actions button:hover{background:rgba(255,255,255,.18)}
  .header .actions .btn-edit{background:var(--btn-bg);border-color:var(--btn-bg)}
  .header .actions .btn-edit:hover{background:var(--btn-hover)}
  .header .actions .btn-dl{background:var(--success);border-color:var(--success)}
  .header .actions .btn-reset{background:var(--warn);border-color:var(--warn)}
  .header .badge{
    background:rgba(255,255,255,.12);padding:5px 12px;
    border-radius:20px;font-size:.78rem;letter-spacing:1px
  }
  .main{display:flex;flex:1;overflow:hidden}
  .sidebar{
    width:250px;background:var(--panel);border-right:1px solid var(--border);
    padding:10px 0;overflow-y:auto;flex-shrink:0
  }
  .sidebar .sec-title{
    font-size:.68rem;text-transform:uppercase;letter-spacing:2px;
    padding:6px 18px 3px;color:#94a3b8;margin-top:6px
  }
  .sidebar .tab{
    display:block;width:100%;padding:9px 18px;background:transparent;
    border:none;color:#cbd5e1;text-align:left;font-size:.85rem;
    cursor:pointer;transition:.12s;border-left:3px solid transparent;font-family:inherit
  }
  .sidebar .tab:hover{background:#334155;color:#fff}
  .sidebar .tab.active{
    background:#1e3a5f;color:#fff;border-left-color:var(--accent);font-weight:600
  }
  .sidebar .tab .emoji{margin-right:5px}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .diagram-panel{
    flex:1;position:relative;overflow:hidden;background:#f1f5f9
  }
  .diagram-panel.editing{background:#fefce8}
  #svgContainer{
    width:100%;height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;
  }
  #svgContainer svg{display:block}
  /* Drag hints */
  #svgContainer.editing .node:hover{outline:3px dashed #f59e0b;outline-offset:2px;cursor:grab}
  #svgContainer.editing .node:active{cursor:grabbing}
  /* Text edit overlay */
  .text-editor{
    position:absolute;z-index:30;min-width:120px;min-height:40px;
    background:#fff;border:2px solid #2563eb;border-radius:6px;
    padding:6px 10px;font-size:13px;outline:none;
    box-shadow:0 4px 16px rgba(0,0,0,.2);font-family:inherit
  }
  .zoom-controls{
    position:absolute;bottom:20px;right:20px;display:flex;
    flex-direction:column;gap:4px;z-index:10
  }
  .zoom-controls button{
    width:38px;height:38px;border-radius:8px;border:1px solid #cbd5e1;
    background:#fff;color:#334155;font-size:1.1rem;cursor:pointer;
    transition:.15s;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1)
  }
  .zoom-controls button:hover{background:#f1f5f9;border-color:#94a3b8}
  .zoom-controls .zoom-label{
    text-align:center;font-size:.72rem;color:#64748b;background:#fff;
    border-radius:6px;padding:4px 6px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1e293b;color:#e2e8f0;padding:10px 24px;
    border-radius:8px;font-size:.82rem;z-index:100;
    border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.4);
    opacity:0;transition:opacity .3s;pointer-events:none
  }
  .toast.show{opacity:1}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
  @media(max-width:900px){
    .main{flex-direction:column}
    .sidebar{width:100%;max-height:180px;display:flex;flex-wrap:wrap;overflow-x:auto;padding:6px}
    .sidebar .sec-title{display:none}
    .sidebar .tab{flex-shrink:0;border-left:none;border-bottom:3px solid transparent;font-size:.75rem;padding:7px 10px}
    .sidebar .tab.active{border-left:none;border-bottom-color:var(--accent)}
    .zoom-controls{bottom:10px;right:10px}
    .zoom-controls button{width:32px;height:32px;font-size:.9rem}
  }
  @media print{
    .sidebar,.header .actions,.zoom-controls{display:none!important}
    .diagram-panel{overflow:visible!important;background:#fff!important}
    #svgContainer.editing .node:hover{outline:none!important}
  }
</style>
</head>

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */
let currentDiagram = 'd0';
let isEditMode = false;
let currentSvg = null;
let svgScale = 1;
let nodeOffsets = {};      // {nodeId: {dx, dy}} — cumulative drag offsets from original position
let nodeLabels = {};       // {nodeId: "new label"} — edited text
let nodeOrigins = {};      // {nodeId: {x, y}} — original Mermaid node positions (from SVG transform)
let dragState = null;      // {nodeId, startX, startY, origDx, origDy}
let textEditEl = null;

/* ═══════════════════════════════════════════════════
   MERMAID RENDERING
   ═══════════════════════════════════════════════════ */
async function renderMermaid(id) {
  const container = document.createElement('div');
  const uid = 'mermaid_' + Math.random().toString(36).slice(2, 8);
  container.style.cssText = 'position:absolute;visibility:hidden;width:0;height:0;overflow:hidden;';
  document.body.appendChild(container);
  try {
    const { svg } = await mermaid.render(uid, diagramSources[id]);
    container.innerHTML = svg;
    const svgEl = container.querySelector('svg');
    return svgEl ? svgEl.cloneNode(true) : null;
  } catch(e) {
    console.error('Mermaid render failed:', e);
    return null;
  } finally {
    container.remove();
  }
}

/* ═══════════════════════════════════════════════════
   NODE ID EXTRACTION from SVG
   ═══════════════════════════════════════════════════ */
function extractNodeId(el) {
  const gid = el.id || '';
  const m = gid.match(/^(?:flowchart-)?([A-Za-z_][\w]*?)(?:-\d+)?$/);
  if (m && m[1] && m[1] !== 'flowchart') return m[1];
  const parts = gid.split('-');
  if (parts.length >= 3) return parts.slice(1, -1).join('-');
  return '';
}

function collectNodeGroups(svgEl) {
  const map = {};
  svgEl.querySelectorAll('g.node').forEach(g => {
    const nid = extractNodeId(g);
    if (nid) map[nid] = g;
  });
  return map;
}

/* ═══════════════════════════════════════════════════
   EDGE PATH UPDATING
   Stores original path coords per edge, applies FULL offsets.
   ═══════════════════════════════════════════════════ */
let edgeMapCache = null;     // [{el, pathEl, srcId, tgtId}]
let nodeMapCache = null;     // {nodeId: g element}
let edgeOrigins = {};        // {edgeGid: [sx,sy,c1x,c1y,c2x,c2y,ex,ey]} — original bezier coords

function buildEdgeMap(svgEl, nodeMap) {
  edgeMapCache = [];
  edgeOrigins = {};

  // DIAGNOSTIC: dump ALL g elements with their id and class
  const allGs = svgEl.querySelectorAll('g');
  const gInfo = Array.from(allGs).map(g => g.id + '|' + (g.getAttribute('class')||'')).join(', ');
  console.log('[edgeMap] All ' + allGs.length + ' <g> elements: ' + gInfo.substring(0, 500));
  // Also dump all path elements
  const allPaths = svgEl.querySelectorAll('path');
  const pInfo = Array.from(allPaths).map(p => {
    const pid = (p.parentElement||p.parentNode).id || '';
    return pid + ':' + (p.getAttribute('d')||'').substring(0, 40);
  }).join(' | ');
  console.log('[edgeMap] All ' + allPaths.length + ' <path> elements (parentId:first40chars): ' + pInfo.substring(0, 500));

  // Try multiple ways to find edge elements
  let edgeGroups = svgEl.querySelectorAll('g[id^="L-"]');
  console.log('[edgeMap] Found ' + edgeGroups.length + ' edge groups by id^="L-", nodeMap has ' + Object.keys(nodeMap).length + ' nodes');

  // If that also fails, try all g elements with class containing "edge"
  if (edgeGroups.length === 0) {
    edgeGroups = svgEl.querySelectorAll('g[class*="edge"]');
    console.log('[edgeMap] Retry with class*=edge: ' + edgeGroups.length + ' groups');
  }
  // Last resort: get all path elements with marker-end (edges always have arrow markers)
  if (edgeGroups.length === 0) {
    const paths = svgEl.querySelectorAll('path[marker-end]');
    console.log('[edgeMap] Retry with path[marker-end]: ' + paths.length + ' paths');
    // Each path is a direct child of some g — find the parent g
    const parentIds = new Set();
    paths.forEach(p => {
      const parent = p.parentElement || p.parentNode;
      if (parent && parent.tagName === 'g') parentIds.add(parent);
    });
    edgeGroups = Array.from(parentIds);
  }

  edgeGroups.forEach(g => {
    const gid = g.id || '';
    // Parse source/target from edge ID: L-src-tgt-N or L-src-tgt
    const parts = gid.split('-');
    if (parts.length < 3) return;
    const last = parts[parts.length - 1];
    const hasNum = /^\d+$/.test(last);
    const inner = hasNum ? parts.slice(1, -1) : parts.slice(1);

    let srcId = '', tgtId = '';
    for (let i = 1; i < inner.length; i++) {
      const src = inner.slice(0, i).join('-');
      const tgt = inner.slice(i).join('-');
      if (nodeMap[src]) { srcId = src; tgtId = tgt; break; }
    }

    const pathEl = g.querySelector('path') || g.getElementsByTagName('path')[0];
    if (!pathEl) return;
    if (!srcId) return;

    edgeMapCache.push({ el: g, pathEl, srcId, tgtId });
    const d = pathEl.getAttribute('d') || '';
    // Parse bezier: try cubic first, then quadratic, then line
    let re = /M\s*([\d.]+)\s+([\d.]+)\s+C\s*([\d.]+)\s+([\d.]+)\s*,?\s*([\d.]+)\s+([\d.]+)\s*,?\s*([\d.]+)\s+([\d.]+)/i;
    let m = d.match(re);
    if (!m) {
      re = /M\s*([\d.]+)\s+([\d.]+)\s+Q\s*([\d.]+)\s+([\d.]+)\s*,?\s*([\d.]+)\s+([\d.]+)/i;
      m = d.match(re);
      if (m) {
        const sx=+m[1], sy=+m[2], qx=+m[3], qy=+m[4], ex=+m[5], ey=+m[6];
        const c1x = sx + 2*(qx-sx)/3, c1y = sy + 2*(qy-sy)/3;
        const c2x = ex + 2*(qx-ex)/3, c2y = ey + 2*(qy-ey)/3;
        m = [null, sx, sy, c1x, c1y, c2x, c2y, ex, ey];
      }
    }
    if (!m) {
      re = /M\s*([\d.]+)\s+([\d.]+)\s+L\s*([\d.]+)\s+([\d.]+)/i;
      m = d.match(re);
      if (m) {
        const sx=+m[1], sy=+m[2], ex=+m[3], ey=+m[4];
        m = [null, sx, sy, sx, sy, ex, ey, ex, ey];
      }
    }
    if (m) {
      edgeOrigins[gid] = m.slice(1).map(Number);
    }
  });

  console.log('[edgeMap] Cached ' + edgeMapCache.length + ' edges, ' + Object.keys(edgeOrigins).length + ' with origin data');
}

function applyAllOffsetsToEdges() {
  if (!currentSvg || !edgeMapCache) { console.log('[edges] No currentSvg or edgeMapCache'); return; }
  let updated = 0;
  edgeMapCache.forEach(edge => {
    const gid = edge.el.id || '';
    const orig = edgeOrigins[gid];
    if (!orig) return;
    const offSrc = nodeOffsets[edge.srcId] || { dx: 0, dy: 0 };
    const offTgt = nodeOffsets[edge.tgtId] || { dx: 0, dy: 0 };
    if (offSrc.dx === 0 && offSrc.dy === 0 && offTgt.dx === 0 && offTgt.dy === 0) return;
    updated++;
    edge.pathEl.setAttribute('d',
      `M ${orig[0]+offSrc.dx} ${orig[1]+offSrc.dy} C ${orig[2]+offSrc.dx} ${orig[3]+offSrc.dy}, ${orig[4]+offTgt.dx} ${orig[5]+offTgt.dy}, ${orig[6]+offTgt.dx} ${orig[7]+offTgt.dy}`);
  });
  console.log('[edges] Updated ' + updated + ' edge paths');
}

/* ═══════════════════════════════════════════════════
   DRAG & DROP
   ═══════════════════════════════════════════════════ */
function getEventPos(e) {
  if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

// Convert screen pixel delta to SVG viewBox coordinate delta
function screenToSvgDelta(screenDx, screenDy) {
  if (!currentSvg) return { dx: screenDx / svgScale, dy: screenDy / svgScale };
  const vb = currentSvg.viewBox.baseVal;
  const rect = currentSvg.getBoundingClientRect();
  if (!vb || !vb.width || !rect.width) return { dx: screenDx / svgScale, dy: screenDy / svgScale };
  const sx = vb.width / rect.width / svgScale;
  const sy = vb.height / rect.height / svgScale;
  return { dx: screenDx * sx, dy: screenDy * sy };
}

// Walk up DOM tree crossing foreignObject boundary to find g.node
function findNodeEl(el) {
  while (el) {
    if (el.classList && el.classList.contains('node')) return el;
    el = el.parentElement || el.parentNode;
  }
  return null;
}

function onDragStart(e) {
  if (!isEditMode) return;
  // Close text editor if open
  if (textEditEl) { textEditEl.blur(); textEditEl.remove(); textEditEl = null; }

  const target = e.target.closest ? e.target.closest('.node') : findNodeEl(e.target);
  if (!target) return;
  const nid = extractNodeId(target);
  if (!nid) return;

  e.preventDefault();

  const off = nodeOffsets[nid] || { dx: 0, dy: 0 };
  const pos = getEventPos(e);
  dragState = {
    nodeId: nid,
    el: target,
    startX: pos.x,
    startY: pos.y,
    origDx: off.dx,
    origDy: off.dy,
    moved: false
  };
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const pos = getEventPos(e);
  const delta = screenToSvgDelta(pos.x - dragState.startX, pos.y - dragState.startY);
  const dx = dragState.origDx + delta.dx;
  const dy = dragState.origDy + delta.dy;
  if (Math.abs(delta.dx) > 1 || Math.abs(delta.dy) > 1) {
    dragState.moved = true;
  }
  // Apply original position + offset to node transform
  const orig = nodeOrigins[dragState.nodeId] || { x: 0, y: 0 };
  dragState.el.setAttribute('transform', `translate(${orig.x + dx},${orig.y + dy})`);
  // Store offset (not absolute position)
  nodeOffsets[dragState.nodeId] = { dx, dy };
  // Re-apply all edges from originals with full offsets
  applyAllOffsetsToEdges();
  console.log('[drag] node=' + dragState.nodeId + ' dx=' + dx.toFixed(1) + ' dy=' + dy.toFixed(1));
}

function onDragEnd(e) {
  if (!dragState) return;
  if (dragState.moved) {
    saveState();
  }
  dragState = null;
}

/* ═══════════════════════════════════════════════════
   TEXT EDITING (double-click)
   ═══════════════════════════════════════════════════ */
function positionTextEditor(targetEl) {
  if (!textEditEl) return;
  const panel = document.getElementById('diagramPanel');
  const panelRect = panel.getBoundingClientRect();
  // Get the foreignObject or rect inside the node
  const fo = targetEl.querySelector('foreignObject');
  const rect = targetEl.querySelector('rect');
  let el = fo || rect || targetEl;
  const elRect = el.getBoundingClientRect();
  textEditEl.style.left = (elRect.left - panelRect.left) + 'px';
  textEditEl.style.top = (elRect.top - panelRect.top) + 'px';
  textEditEl.style.minWidth = Math.max(120, elRect.width) + 'px';
  textEditEl.style.minHeight = Math.max(40, elRect.height) + 'px';
}

function startTextEdit(targetEl) {
  if (!isEditMode) return;
  const nid = extractNodeId(targetEl);
  if (!nid) return;

  // Get current label
  const fo = targetEl.querySelector('foreignObject');
  let currentText = '';
  if (fo) {
    const div = fo.querySelector('div');
    currentText = div ? div.innerHTML : fo.innerHTML || '';
  } else {
    const texts = targetEl.querySelectorAll('text');
    currentText = Array.from(texts).map(t => t.textContent).join('<br/>');
  }

  // Save original label if not already saved
  if (!nodeLabels[nid]) {
    nodeLabels[nid] = currentText;
  }

  // Create text editor overlay
  if (textEditEl) textEditEl.remove();
  textEditEl = document.createElement('div');
  textEditEl.className = 'text-editor';
  textEditEl.contentEditable = 'true';
  textEditEl.innerHTML = nodeLabels[nid];
  textEditEl.setAttribute('data-node-id', nid);
  document.getElementById('diagramPanel').appendChild(textEditEl);
  positionTextEditor(targetEl);

  const finish = () => {
    if (!textEditEl) return;
    const newLabel = textEditEl.innerHTML;
    const editNid = textEditEl.getAttribute('data-node-id');
    textEditEl.remove();
    textEditEl = null;

    if (editNid && newLabel !== nodeLabels[editNid]) {
      nodeLabels[editNid] = newLabel;
      applyLabelToNode(editNid, newLabel);
      saveState();
    }
  };

  textEditEl.addEventListener('blur', finish);
  textEditEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { textEditEl.innerHTML = nodeLabels[nid]; finish(); }
    if (e.key === 'Enter' && e.ctrlKey) finish();
  });
  textEditEl.focus();
}

function applyLabelToNode(nid, label) {
  if (!currentSvg) return;
  const el = currentSvg.querySelector(`g.node[id*="${nid}"]`);
  if (!el) return;
  const fo = el.querySelector('foreignObject');
  if (fo) {
    const div = fo.querySelector('div');
    if (div) {
      div.innerHTML = label;
    } else {
      fo.innerHTML = label;
    }
    // Adjust height
    const lineCount = (label.match(/<br\/?>/g) || []).length + 1;
    const newH = Math.max(40, lineCount * 28 + 20);
    fo.setAttribute('height', newH);
    const rect = el.querySelector('rect');
    if (rect) rect.setAttribute('height', newH);
  }
}

/* ═══════════════════════════════════════════════════
   PERSISTENCE
   ═══════════════════════════════════════════════════ */
function storageKey(id, suffix) { return 'v5_' + id + '_' + suffix; }

function saveState() {
  try {
    localStorage.setItem(storageKey(currentDiagram, 'offsets'), JSON.stringify(nodeOffsets));
    localStorage.setItem(storageKey(currentDiagram, 'labels'), JSON.stringify(nodeLabels));
    localStorage.setItem('v5_lastDiagram', currentDiagram);
  } catch(e) {}
}

function loadState(id) {
  try {
    const off = localStorage.getItem(storageKey(id, 'offsets'));
    const lbl = localStorage.getItem(storageKey(id, 'labels'));
    return {
      offsets: off ? JSON.parse(off) : {},
      labels: lbl ? JSON.parse(lbl) : {}
    };
  } catch(e) { return { offsets: {}, labels: {} }; }
}

/* ═══════════════════════════════════════════════════
   DRAW.IO XML EXPORT
   ═══════════════════════════════════════════════════ */
function parseMermaidForExport(mermaidText) {
  const nodes = {};
  const edges = [];
  const edgeSet = new Set();

  const classDefs = {};
  const cdRe = /classDef\s+(\w+)\s+(.+)/g;
  let cm;
  while ((cm = cdRe.exec(mermaidText)) !== null) {
    const s = {};
    if (cm[2].includes('fill:')) s.fill = cm[2].match(/fill:(#[^\s,]+)/)[1];
    if (cm[2].includes('stroke:')) s.stroke = cm[2].match(/stroke:(#[^\s,]+)/)[1];
    if (cm[2].includes('color:')) s.color = cm[2].match(/color:(#[^\s,]+)/)[1];
    if (cm[2].includes('stroke-width:')) s.strokeWidth = cm[2].match(/stroke-width:(\d+)/)[1];
    if (cm[2].includes('stroke-dasharray:')) s.dashed = true;
    classDefs[cm[1]] = s;
  }

  const classAssigns = {};
  const caRe = /^\s*class\s+([\w,]+)\s+(\w+)\s*$/gm;
  let am;
  while ((am = caRe.exec(mermaidText)) !== null) {
    am[1].split(',').map(s => s.trim()).filter(Boolean).forEach(id => {
      classAssigns[id] = am[2];
    });
  }

  const nodeRe = /(\w+)\[("|')([\s\S]*?)("|')\]/g;
  let nm;
  while ((nm = nodeRe.exec(mermaidText)) !== null) {
    const id = nm[1], label = nm[3];
    const cls = classAssigns[id] || '', styleDef = classDefs[cls] || null;
    nodes[id] = { id, label, cls, styleDef, w: 180, h: 80 };
  }

  const lines = mermaidText.split('\n');
  for (let line of lines) {
    line = line.trim();
    if (!line || /^(classDef|class\s|subgraph|end|direction|flowchart)/.test(line)) continue;
    line = line.replace(/(\w+)\["[^"]*"\]/g, '$1');
    const edgeRe = /(\w+)\s*(--\s*"([^"]*)"\s*)?(-->|==>|-\.->|<-->|---)\s*(\|"([^"]*)"\|)?\s*(\w+)/g;
    let em;
    while ((em = edgeRe.exec(line)) !== null) {
      const src = em[1], label1 = em[3] || '', op = em[4], label2 = em[6] || '', tgt = em[7];
      if (op === '~~~') continue;
      const label = label1 || label2;
      let type = 'solid';
      if (op === '==>') type = 'thick';
      else if (op === '-.->') type = 'dashed';
      else if (op === '<-->') type = 'bidirectional';
      else if (op === '---') type = 'none';
      const key = `${src}->${tgt}`;
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        edges.push({ source: src, target: tgt, type, label, bidirectional: op === '<-->' });
      }
      const tgtStart = em[0].lastIndexOf(tgt);
      if (tgtStart > 0) edgeRe.lastIndex = em.index + tgtStart;
    }
  }

  // Apply stored positions
  Object.keys(nodes).forEach(id => {
    nodes[id].x = 20 + Math.random() * 500;
    nodes[id].y = 20 + Math.random() * 400;
    const label_lines = nodes[id].label.split('<br/>').length;
    nodes[id].h = Math.max(60, label_lines * 26 + 20);
    nodes[id].w = Math.max(160, Math.min(400, nodes[id].label.length * 7));
  });

  return { nodes: Object.values(nodes), edges };
}

function generateDrawioXml(data) {
  function esc(raw) {
    return raw.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function styleStr(def) {
    if (!def) return 'rounded=1;whiteSpace=wrap;html=1;';
    const p = ['rounded=1', 'whiteSpace=wrap', 'html=1'];
    if (def.fill) p.push('fillColor=' + def.fill);
    if (def.stroke) p.push('strokeColor=' + def.stroke);
    if (def.color) p.push('fontColor=' + def.color);
    if (def.strokeWidth) p.push('strokeWidth=' + def.strokeWidth);
    if (def.dashed) p.push('dashed=1');
    return p.join(';') + ';';
  }

  let xml = `<mxGraphModel dx="0" dy="0" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1600" pageHeight="1200">
  <root>
    <mxCell id="0"/>
    <mxCell id="1" parent="0"/>
`;
  let counter = 2;
  const idMap = {};
  data.nodes.forEach(n => {
    const cid = 'cell-' + (counter++);
    idMap[n.id] = cid;
    xml += `    <mxCell id="${cid}" value="${esc(n.label)}" style="${styleStr(n.styleDef)}" vertex="1" parent="1">
      <mxGeometry x="${Math.round(n.x||0)}" y="${Math.round(n.y||0)}" width="${Math.max(80, n.w||180)}" height="${Math.max(40, n.h||80)}" as="geometry"/>
    </mxCell>
`;
  });
  data.edges.forEach(e => {
    const src = idMap[e.source], tgt = idMap[e.target];
    if (!src || !tgt) return;
    const cid = 'cell-' + (counter++);
    let es = 'edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;';
    if (e.type === 'dashed') es += 'dashed=1;dashPattern=8 8;';
    else if (e.type === 'thick') es += 'strokeWidth=3;';
    es += 'endArrow=classic;';
    if (e.bidirectional) es += 'startArrow=classic;';
    xml += `    <mxCell id="${cid}" value="${esc(e.label||'')}" style="${es}" edge="1" parent="1" source="${src}" target="${tgt}">
      <mxGeometry relative="1" as="geometry"/>
    </mxCell>
`;
  });
  xml += `  </root>
</mxGraphModel>`;
  return xml;
}

/* ═══════════════════════════════════════════════════
   UI: RENDER + DISPLAY
   ═══════════════════════════════════════════════════ */
async function displayDiagram(id) {
  const container = document.getElementById('svgContainer');
  container.innerHTML = '<div style="color:#64748b;font-size:.9rem;">正在渲染...</div>';

  const svgEl = await renderMermaid(id);
  if (!svgEl) {
    container.innerHTML = '<div style="color:#f87171;">渲染失败</div>';
    return;
  }

  currentSvg = svgEl;
  container.innerHTML = '';
  container.appendChild(svgEl);

  // Load saved state
  const saved = loadState(id);
  nodeOffsets = saved.offsets;
  nodeLabels = saved.labels;

  // Build node & edge maps + store edge originals
  nodeMapCache = collectNodeGroups(svgEl);
  buildEdgeMap(svgEl, nodeMapCache);

  // Extract original Mermaid positions for each node
  nodeOrigins = {};
  Object.keys(nodeMapCache).forEach(nid => {
    const g = nodeMapCache[nid];
    const t = g.getAttribute('transform') || '';
    const m = t.match(/translate\(([\d.]+),\s*([\d.]+)\)/);
    nodeOrigins[nid] = m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 0, y: 0 };
  });

  // Apply saved offsets (add to original position)
  Object.keys(nodeOffsets).forEach(nid => {
    const off = nodeOffsets[nid];
    const orig = nodeOrigins[nid] || { x: 0, y: 0 };
    const g = nodeMapCache[nid];
    if (g) {
      g.setAttribute('transform', `translate(${orig.x + off.dx},${orig.y + off.dy})`);
    }
  });

  // Apply saved labels
  Object.keys(nodeLabels).forEach(nid => {
    applyLabelToNode(nid, nodeLabels[nid]);
  });

  // Apply edge offsets
  applyAllOffsetsToEdges();

  // Attach interaction handlers
  attachNodeHandlers(svgEl);
  updateEditModeUI();
}

let globalListenersAdded = false;

function attachNodeHandlers(svgEl) {
  svgEl.querySelectorAll('g.node').forEach(g => {
    g.classList.add('node');
    const nid = extractNodeId(g);
    g.setAttribute('data-node-id', nid);
    g.addEventListener('mousedown', onDragStart);
    g.addEventListener('touchstart', onDragStart, { passive: false });
    g.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startTextEdit(g);
    });
  });
  // Global move/end handlers — add only once
  if (!globalListenersAdded) {
    globalListenersAdded = true;
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
  }
}

function updateEditModeUI() {
  const panel = document.getElementById('diagramPanel');
  const container = document.getElementById('svgContainer');
  const btn = document.getElementById('btnEdit');

  if (isEditMode) {
    panel.classList.add('editing');
    container.classList.add('editing');
    btn.textContent = '👁️ 预览模式';
    btn.style.background = 'var(--success)';
    document.getElementById('statusBadge').textContent = 'v5.0 | 编辑中 ✏️';
  } else {
    panel.classList.remove('editing');
    container.classList.remove('editing');
    btn.textContent = '✏️ 编辑模式';
    btn.style.background = 'var(--btn-bg)';
    document.getElementById('statusBadge').textContent = 'v5.0 | 预览中 👁️';
  }
}

/* ═══════════════════════════════════════════════════
   UI: BUTTON ACTIONS
   ═══════════════════════════════════════════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function toggleEdit() {
  // Close text editor if open
  if (textEditEl) { textEditEl.blur(); textEditEl.remove(); textEditEl = null; }
  isEditMode = !isEditMode;
  updateEditModeUI();
  toast(isEditMode ? '✏️ 编辑模式：拖拽移动节点，双击编辑文字' : '👁️ 预览模式：只读查看');
}

async function switchDiagram(btn) {
  const newId = btn.dataset.diagram;
  if (newId === currentDiagram && btn.classList.contains('active')) return;

  // Save current state
  saveState();

  // Update sidebar
  document.querySelectorAll('.sidebar .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentDiagram = newId;

  await displayDiagram(newId);
  document.getElementById('svgContainer').scrollTo(0, 0);
}

async function resetDiagram() {
  if (!confirm(`确定恢复「${currentDiagram}」为默认版本？所有修改将丢失。`)) return;
  try {
    localStorage.removeItem(storageKey(currentDiagram, 'offsets'));
    localStorage.removeItem(storageKey(currentDiagram, 'labels'));
  } catch(e) {}
  nodeOffsets = {};
  nodeLabels = {};
  nodeOrigins = {};
  await displayDiagram(currentDiagram);
  toast('↺ 已恢复默认版本');
}

async function downloadDrawio() {
  saveState();
  const mermaidText = diagramSources[currentDiagram];
  const data = parseMermaidForExport(mermaidText);
  const xml = generateDrawioXml(data);
  const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `架构图_${currentDiagram}.drawio`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ .drawio 文件已下载（可用桌面端 Draw.io 打开编辑）');
}

async function downloadSVG() {
  if (!currentSvg) { toast('无可导出内容'); return; }
  const clone = currentSvg.cloneNode(true);

  // Apply stored offsets to node positions in the cloned SVG
  clone.querySelectorAll('g.node').forEach(g => {
    const nid = extractNodeId(g);
    const off = nodeOffsets[nid] || { dx: 0, dy: 0 };
    const orig = nodeOrigins[nid] || { x: 0, y: 0 };
    g.setAttribute('transform', `translate(${orig.x + off.dx},${orig.y + off.dy})`);
  });

  // Apply stored labels
  Object.keys(nodeLabels).forEach(nid => {
    const g = clone.querySelector(`g.node[data-node-id="${nid}"]`);
    if (g) {
      const fo = g.querySelector('foreignObject');
      if (fo) {
        const div = fo.querySelector('div');
        if (div) div.innerHTML = nodeLabels[nid];
        else fo.innerHTML = nodeLabels[nid];
      }
    }
  });

  // Apply edge offsets on clone using the same originals
  clone.querySelectorAll('g.edgePath').forEach(g => {
    const gid = g.id || '';
    const orig = edgeOrigins[gid];
    if (!orig) return;
    const parts = gid.split('-');
    if (parts.length < 3) return;
    const last = parts[parts.length - 1];
    const hasNum = /^\d+$/.test(last);
    const inner = hasNum ? parts.slice(1, -1) : parts.slice(1);
    let srcId = '', tgtId = '';
    for (let i = 1; i < inner.length; i++) {
      const src = inner.slice(0, i).join('-');
      const tgt = inner.slice(i).join('-');
      if (nodeMapCache && nodeMapCache[src]) { srcId = src; tgtId = tgt; break; }
    }
    const offSrc = nodeOffsets[srcId] || { dx: 0, dy: 0 };
    const offTgt = nodeOffsets[tgtId] || { dx: 0, dy: 0 };
    const pathEl = g.querySelector('path');
    if (pathEl) {
      pathEl.setAttribute('d',
        `M ${orig[0]+offSrc.dx} ${orig[1]+offSrc.dy} C ${orig[2]+offSrc.dx} ${orig[3]+offSrc.dy}, ${orig[4]+offTgt.dx} ${orig[5]+offTgt.dy}, ${orig[6]+offTgt.dx} ${orig[7]+offTgt.dy}`);
    }
  });

  const data = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `架构图_${currentDiagram}.svg`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ SVG 已下载');
}

function printDiagram() { window.print(); }

/* ═══════════════════════════════════════════════════
   ZOOM
   ═══════════════════════════════════════════════════ */
function zoomSVG(action) {
  if (!currentSvg) return;
  const container = document.getElementById('svgContainer');

  if (action === 'fit') {
    currentSvg.style.transform = '';
    svgScale = 1;
  } else if (action === 'reset') {
    svgScale = 1;
    currentSvg.style.transform = `scale(${svgScale})`;
    currentSvg.style.transformOrigin = 'top left';
  } else {
    svgScale = Math.max(0.2, Math.min(4, svgScale * action));
    currentSvg.style.transform = `scale(${svgScale})`;
    currentSvg.style.transformOrigin = 'top left';
  }
  document.getElementById('zoomLabel').textContent = Math.round(svgScale * 100) + '%';
}

/* ═══════════════════════════════════════════════════
   KEYBOARD
   ═══════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'e') { e.preventDefault(); toggleEdit(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); downloadDrawio(); }
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); zoomSVG('fit'); }
  if (e.key === 'Escape' && isEditMode) { e.preventDefault(); toggleEdit(); }
});

/* ═══════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════ */
async function boot() {
  try {
    document.getElementById('statusBadge').textContent = 'v5.0 | 初始化...';

    // Wait for Mermaid
    if (typeof mermaid === 'undefined') {
      await new Promise((resolve, reject) => {
        let waited = 0;
        const check = () => {
          if (typeof mermaid !== 'undefined') return resolve();
          if (waited > 20000) return reject(new Error('Mermaid加载超时'));
          waited += 100;
          setTimeout(check, 100);
        };
        check();
      });
    }

    mermaid.initialize({
      startOnLoad: false, theme: 'base', securityLevel: 'loose',
      flowchart: {
        useMaxWidth: false, htmlLabels: true, curve: 'basis',
        padding: 18, nodeSpacing: 45, rankSpacing: 55,
      },
      themeVariables: {
        primaryColor: '#e8f0fe', primaryBorderColor: '#1a237e', primaryTextColor: '#1e293b',
        lineColor: '#475569', secondaryColor: '#fce4ec', tertiaryColor: '#e0f2f1',
      }
    });

    const hash = window.location.hash.replace('#', '');
    const startId = (hash && diagramSources[hash]) ? hash : 'd0';
    currentDiagram = startId;

    const activeBtn = document.querySelector(`[data-diagram="${startId}"]`);
    if (activeBtn) {
      document.querySelectorAll('.sidebar .tab').forEach(t => t.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    await displayDiagram(startId);
    document.getElementById('statusBadge').textContent = 'v5.0 | 就绪 👁️';

    // Pre-render other diagrams in background
    setTimeout(async () => {
      for (const id of Object.keys(diagramSources)) {
        if (id === startId) continue;
        try { await renderMermaid(id); } catch(e) {}
      }
    }, 2000);

  } catch(e) {
    console.error('Boot failed:', e);
    document.getElementById('svgContainer').innerHTML =
      '<div style="text-align:center;color:#f87171;padding:40px;"><div style="font-size:2rem;margin-bottom:12px;">⚠️</div><div style="font-size:.9rem;">初始化失败：' + e.message + '</div><div style="color:#94a3b8;font-size:.78rem;margin-top:8px;">请打开浏览器控制台（F12）查看详细日志</div></div>';
    document.getElementById('statusBadge').textContent = 'v5.0 | 错误';
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
